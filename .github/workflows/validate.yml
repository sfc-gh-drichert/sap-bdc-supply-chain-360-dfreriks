# Validate on every push / PR: Python compiles, app YAML parses, container builds.
# Needs no Snowflake credentials.
name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile scripts/*.py tools/gen_l0_seed.py tools/gen_ops_ext.py tools/check_flow.py
      - name: End-to-end flow (seed -> SQL -> bundle -> app, offline)
        run: |
          pip install pandas snowflake-connector-python cryptography
          python tools/check_flow.py
      - name: App YAML
        run: |
          pip install pyyaml
          python -c "import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" \
            app/manifest.yml app/service_spec.yml app/snowflake.yml
      - name: Image path consistent across manifest and service spec
        run: |
          img=$(grep -oE '/sc360_app_provider/[^ ]+' app/service_spec.yml)
          grep -q -- "$img" app/manifest.yml || { echo "::error::manifest image != service_spec image ($img)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build container (no push)
        run: docker buildx build --platform linux/amd64 service/app
